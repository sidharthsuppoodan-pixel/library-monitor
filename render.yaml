# Free tier configuration for Render deployment
services:
  - type: web
    name: library-noise-monitor
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-noise-db
          property: connectionString
      - key: DEVICE_API_KEY
        generateValue: true
      - key: DASHBOARD_API_KEY
        generateValue: true
      - key: DEVICE_ID
        value: esp32-01
      - key: RETENTION_DAYS
        value: '30'

databases:
  - name: library-noise-db
    databaseName: noise_monitor
    user: noise
    plan: free
    region: singapore
    postgresMajorVersion: '16'

